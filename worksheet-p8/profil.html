<!DOCTYPE html>
<html lang="id">
<head>
  <title id="judul-halaman"></title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/komponen.css">
  <link rel="stylesheet" href="./css/tema.css">
  <link rel="stylesheet" href="./css/responsif.css">
</head>
<body>
  <div class="page">
    <header>
      <input type="checkbox" id="tema" class="pengalih-tema">
      <label for="tema" class="tombol-tema">Tema gelap</label>

      <div class="header-baris">
        <h1 id="judul-halaman-tampilan"></h1>
        <nav class="navbar" aria-label="Navigasi halaman">
          <ul>
            <li><a href="#profil">Profil</a></li>
            <li><a href="#list-proyek">Proyek</a></li>
            <li><a href="#list-film">List Film</a></li>
            <li><a href="#tambah-film">Tambah Film</a></li>
            <li><a href="#footer">Tentang Saya</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="isi content">
      <section id="profil">
        <h2>Profil Saya</h2>
        <div class="kartu">
          <div class="kartu__isi">
            <p id="profil-perkenalan"></p>
            <p id="profil-nim"></p>
            <p id="profil-tahun"></p>
            <p id="profil-lokasi"></p>
            <p id="profil-keahlian"></p>
          </div>
        </div>
      </section>

      <section id="list-proyek">
        <h2>Proyek Saya</h2>
        <div class="galeri grid" id="daftar-proyek"></div>
      </section>

      <section id="list-film">
        <h2>List Film Favorit</h2>
        <div class="galeri grid" id="daftar-film"></div>
      </section>

      <section id="tambah-film">
        <h2>Tambah Film</h2>
        <div class="katalog">
          <div class="kartu">
            <div class="kartu__isi">
              <form action="/simpan" method="post">
                <div class="form-kolom">
                  <label for="judul-kolom">Judul</label>
                  <input type="text" id="judul-kolom" name="judul-kolom" required>
                  <span class="pesan-galat">Judul film wajib diisi.</span>
                </div>

                <div class="form-kolom">
                  <label for="tahun-kolom">Tahun Rilis</label>
                  <input type="number" id="tahun-kolom" name="tahun-kolom" min="1888" max="2026" required>
                  <span class="pesan-galat">Masukkan tahun rilis yang valid.</span>
                </div>

                <div class="form-kolom">
                  <label for="rating-kolom">Rating</label>
                  <input type="number" id="rating-kolom" name="rating-kolom" min="0" max="10" step="0.1" required>
                  <span class="pesan-galat">Rating harus berada antara 0 sampai 10.</span>
                </div>

                <button type="submit">Simpan</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer">
      <h3>Tentang Saya</h3>
      <p>Nama: <span id="footer-nama"></span></p>
      <p>NIM: <span id="footer-nim"></span></p>
      <p>Tahun: <span id="footer-tahun"></span></p>
    </footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
